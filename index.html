<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Unblocked by Massey High students, For Massey High students.">
    <title>Tetris | MHS Unblocked Games</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/landmarks.css">

    <style>
          .frame {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
            background-color: #ffe4aa;
        }
    </style>
</head>

<body>
    <div class="box header">
        <img src="/Images/Banner.png" alt="MHS Unblocked Games Banner..." width="100%">
        <hr>
        <h1 class="subheading" style="font-size: 400%;">Tetris</h1>
    </div>

    <div class="box frame" id="ruffle" width="100%" height="100%">
        <script src="main.js"></script>
        <script src="ruffle.js"></script>
        <script>
            window.RufflePlayer = window.RufflePlayer || {};
            window.addEventListener("load", (event) => {
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                const container = document.getElementById("ruffle");
                player.id = "player";
                player.style.width = "100%";
                player.style.height = "100%";
                container.appendChild(player);
                player.load("flashtetris.swf");
            });
        </script>
    </div>
</body>
</html>
