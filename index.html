<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Unblocked by Massey High students, For Massey High students.">
    <title>MHS Unblocked Games</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="landmarks.css">
    <style>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5808529320365371"
     crossorigin="anonymous"></script>
        
        .footer {
            margin-top: 2rem;
            padding: 2rem;
            background: #ffca56;
            color: white;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 0.2rem;
            width: 100%;
            flex-shrink: 0;
        }

        .games {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            background-color: #ffe4aa;
        }

        .gamebutton {
            display: inline-block;
            margin: 10px;
            cursor: pointer;
            transition: transform .18s ease;
            background-color: transparent;
            border: none;

            width: 256px;
            height: 256px;
        }

        .gamebutton:hover {
            transform: scale(1.1);
        }

        .gamebutton img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10%;
            transition: filter .18s ease;
        }

        .gamebutton:hover img {
            filter: brightness(50%);
        }

        .gamebutton:active {
            transform: scale(0.9);
            filter: brightness(45%)
        }

        .gameLabel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%;
            max-height: 90%;
            padding: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            font-weight: 700;
            font-size: clamp(1.25rem, max(1.25rem, 3.5vw), 2.8rem);
            line-height: 1.2;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transition: opacity 0.18s ease;
            pointer-events: none;
            z-index: 10;

        }

        .gamebutton:hover .gameLabel {
            opacity: 1;
        }

        a:link {
            color: white;
            background-color: transparent;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        a:visited {
            color: darkgrey;
            background-color: transparent;
            text-decoration: none;
        }

        a:hover {
            color: darkgrey;
            background-color: transparent;
            text-decoration: underline;
        }

        a:active {
            color: black;
            background-color: transparent;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="box header">
        <img src="Images/Banner.png" alt="MHS Unblocked Games Banner..." width="100%">
        <hr>
        <h1 class="subheading">Unblocked by Massey High students, For Massey High students.</h1>
    </div>

    <div style="text-align:center; margin: 20px;">
        <input type="text" id="searchBar" placeholder="Search games..."
               style="width: 100%; padding: 10px; font-size: 16px; border-radius: 100px;">
    </div>

    <div class="box games" id="gamesContainer"></div>

    <script>
        async function loadGames() {
            try {
                const response = await fetch(`config.json?t=${Date.now()}`);
                const data = await response.json();
                const games = data.games;
                const container = document.getElementById('gamesContainer');
                const searchBar = document.getElementById('searchBar');

                function renderGames(filter = "") {
                    container.innerHTML = "";
                    games
                        .filter(game => game.name.toLowerCase().includes(filter.toLowerCase()))
                        .forEach(game => {

                            const button = document.createElement('button');
                            button.classList.add('gamebutton');

                            const img = document.createElement('img');
                            img.src = game.icon || 'Images/Placeholder512x512.png';
                            img.alt = game.name;
                            button.appendChild(img);

                            const label = document.createElement('span');
                            label.classList.add('gameLabel');
                            label.innerText = game.name;
                            button.appendChild(label);

                            button.onclick = () => {
                                window.location.href = game.path
                            };

                            container.appendChild(button);
                        });
                }

                renderGames();

                searchBar.addEventListener('input', e => {
                    renderGames(e.target.value);
                });

            } catch (err) {
                console.error('Failed to load config.json:', err);
                document.getElementById('gamesContainer').innerText =
                    "Couldn't load games. Try refreshing the page. If it still doesn't load, contact masseyhighunblockedgames@gmail.com.";
            }
        }

        loadGames();
    </script>

    <div class="footer">
        <h2>&copy; MHS Unblocked Games. All rights reserved.</h2>
        <span></span>
        <a href="mailto:masseyhighunblockedgames@gmail.com">
            Contact Us
        </a>
        <a href="https://github.com/mhsunblockedgames">
            View our repo
        </a>
    </div>
</body>
</html>
